name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: "3.9"
          - os: macos-latest
            python: "3.12"
          - os: ubuntu-22.04
            python: "3.9"
          - os: ubuntu-22.04
            python: "3.12"
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run bridge tests
        run: python -m unittest discover -s m1 -t m1 -p "test_*.py" -v
      - name: Run integrated bridge tests
        run: python -m unittest discover -s m1/integrated -t m1/integrated -p "test_*.py" -v
      - name: Check the state-only snapshot runs
        run: python m1/global_bridge.py --once
      - name: Exercise the Win32 serial path over a loopback pipe
        if: runner.os == 'Windows'
        run: python m1/verify_windows_serial.py
      - name: Install and run the installed copy
        if: runner.os == 'Windows'
        run: python m1/verify_windows_install.py
